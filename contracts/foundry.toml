[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
celo = "https://forno.celo.org"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", chain = 42220, url = "https://api.celoscan.io/api" }

[fmt]
line_length = 110
